name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: 'URL ZIP project Flutter'
        required: true
        type: string
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      package_name:
        description: 'Package name (contoh: com.xera.myapp)'
        required: true
        type: string
      priority:
        description: 'owner / user'
        required: false
        default: 'user'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g
      PROJECT_URL: ${{ inputs.project_url }}
      APP_NAME: ${{ inputs.app_name }}
      PKG_NAME: ${{ inputs.package_name }}
    steps:
      - name: Download & validate project
        run: |
          curl -fL --retry 3 -o project.zip "$PROJECT_URL"
          mkdir -p project
          unzip -q project.zip -d project
          PUB=$(find project -name pubspec.yaml -not -path "*/build/*" | head -n 1)
          if [ -z "$PUB" ]; then
            echo "::error::ZIP bukan project Flutter (pubspec.yaml tidak ditemukan)"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Flutter disamakan dengan project (lock file: Dart >= 3.9 = Flutter 3.35)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # Cache pub & Gradle: build berikutnya nggak download ulang dependency
      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-${{ runner.os }}-

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          # applicationId & label sesuai input (groovy & kts)
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i -E "s/applicationId[[:space:]]*=?[[:space:]]*\"[^\"]*\"/applicationId = \"$PKG_NAME\"/" "$f" || true
          done

      # Adaptive icon (Android 8+): ikon ikut bentuk launcher (bulat/squircle), bukan kotak. Nama ikon diambil dari AndroidManifest. Kalau ikonnya sudah adaptive, dilewati.
      - name: Adaptive icon
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          RES=android/app/src/main/res
          MAN=android/app/src/main/AndroidManifest.xml
          NAME=$(grep -o 'android:icon="@mipmap/[^"]*"' "$MAN" | head -n 1 | sed -E 's/.*@mipmap\/([^"]*)"/\1/' || true)
          if [ -z "$NAME" ]; then NAME=ic_launcher; fi
          echo "Nama ikon di manifest: $NAME"
          if [ -f "$RES/mipmap-anydpi-v26/$NAME.xml" ]; then
            echo "Ikon $NAME sudah adaptive, skip."
            exit 0
          fi
          command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          if ! command -v convert >/dev/null 2>&1; then
            echo "ImageMagick tidak ada, skip adaptive icon."
            exit 0
          fi
          SRC=""
          for D in xxxhdpi xxhdpi xhdpi hdpi mdpi; do
            if [ -f "$RES/mipmap-$D/$NAME.png" ]; then SRC="$RES/mipmap-$D/$NAME.png"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "$NAME.png tidak ditemukan, skip adaptive icon."
            exit 0
          fi
          # warna background = warna pojok ikon, supaya ikon yang punya background sendiri nyatu (nggak kelihatan kotak di dalam)
          BG_HEX=$(convert "$SRC" -background white -alpha remove -depth 8 -crop 1x1+0+0 -format '%[hex:p{0,0}]' info: 2>/dev/null || true)
          BG_COLOR="#FFFFFF"
          if [ -n "$BG_HEX" ]; then BG_COLOR="#${BG_HEX:0:6}"; fi
          FAIL=0
          for FG in 108:mdpi 162:hdpi 216:xhdpi 324:xxhdpi 432:xxxhdpi; do
            PX=${FG%%:*}; DPI=${FG##*:}; INNER=$((PX * 60 / 100))
            mkdir -p "$RES/mipmap-$DPI"
            convert "$SRC" -resize ${INNER}x${INNER} -background none -gravity center -extent ${PX}x${PX} "$RES/mipmap-$DPI/${NAME}_foreground.png" || FAIL=1
          done
          if [ "$FAIL" = "1" ]; then
            echo "Gagal bikin foreground, skip adaptive icon."
            rm -f "$RES"/mipmap-*/${NAME}_foreground.png
            exit 0
          fi
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          cat > "$RES/values/${NAME}_background.xml" << BG_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="${NAME}_background">${BG_COLOR}</color>
          </resources>
          BG_EOF
          cat > "$RES/mipmap-anydpi-v26/$NAME.xml" << ADAPT_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/${NAME}_background"/>
              <foreground android:drawable="@mipmap/${NAME}_foreground"/>
          </adaptive-icon>
          ADAPT_EOF
          cp "$RES/mipmap-anydpi-v26/$NAME.xml" "$RES/mipmap-anydpi-v26/${NAME}_round.xml"
          echo "Adaptive icon $NAME dibuat, background $BG_COLOR"
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --target-platform android-arm64

      - name: Collect APK
        run: |
          set -euo pipefail
          MAN="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          RAW=$(grep -o 'android:label="[^"]*"' "$MAN" | head -n 1 | sed -E 's/.*="([^"]*)"/\1/' || true)
          if [[ "$RAW" == @string/* ]]; then
            KEY=${RAW#@string/}
            RAW=$(grep -o "<string name=\"$KEY\">[^<]*</string>" "$PROJECT_DIR/android/app/src/main/res/values/strings.xml" 2>/dev/null | head -n 1 | sed -E 's/.*>([^<]*)<.*/\1/' || true)
          fi
          SAFE=$(echo "$RAW" | tr ' ' '_' | tr -cd 'A-Za-z0-9_-')
          [ -z "$SAFE" ] && SAFE="app"
          APK=$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name "*.apk" | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "::error::Tidak ada APK yang terbentuk"
            exit 1
          fi
          mkdir -p out
          cp "$APK" "out/${SAFE}.apk"
          echo "Nama dari AndroidManifest: ${SAFE}.apk"
          ls -la out

      # Upload APK ke MediaFire (kalau > 50 MB). Kalau gagal, build tetap sukses dan bot pakai fallback GitHub Release.
      - name: Upload APK ke MediaFire
        if: success()
        continue-on-error: true
        env:
          MEDIAFIRE_SESSION_TOKEN: ${{ secrets.MEDIAFIRE_SESSION_TOKEN }}
          APK_SEARCH_DIR: out
        run: |
          node - <<'JSEOF'
          // Upload APK ke MediaFire dari job GitHub Actions. Tanpa dependency (Node 18+).
          // Env: MEDIAFIRE_SESSION_TOKEN (wajib), APK_SEARCH_DIR (default '.')
          // APK <= 50 MB dilewati (dikirim langsung ke Telegram oleh bot).
          // Output log: MEDIAFIRE_URL=... | MEDIAFIRE_SKIP=... | MEDIAFIRE_ERROR=...
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const API = process.env.MEDIAFIRE_API || 'https://www.mediafire.com/api/1.4';
          const TOKEN = process.env.MEDIAFIRE_SESSION_TOKEN || '';
          const SEARCH_DIR = process.env.APK_SEARCH_DIR || '.';
          const SKIP_BELOW = 50 * 1024 * 1024;
          const UNIT_RETRY = 3;
          const POLL_INTERVAL = 3000;
          const POLL_MAX = 600;
          const SKIP_DIRS = new Set(['node_modules', '.git']);

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function safeName(n) { return String(n || 'app.apk').replace(/[^A-Za-z0-9._-]/g, '_'); }
          function sha256Buf(buf) { return crypto.createHash('sha256').update(buf).digest('hex'); }
          function sha256Stream(file) {
              return new Promise((resolve, reject) => {
                  const h = crypto.createHash('sha256');
                  fs.createReadStream(file).on('data', d => h.update(d)).on('end', () => resolve(h.digest('hex'))).on('error', reject);
              });
          }
          function findApks(dir, out = []) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) { if (!SKIP_DIRS.has(e.name)) findApks(p, out); }
                  else if (e.isFile() && e.name.toLowerCase().endsWith('.apk')) out.push(p);
              }
              return out;
          }
          function pickApk(files) { return files.find(f => !/arm|x86/i.test(path.basename(f))) || files[0]; }
          function readRange(fd, buf, offset) {
              let read = 0;
              while (read < buf.length) {
                  const n = fs.readSync(fd, buf, read, buf.length - read, offset + read);
                  if (n === 0) throw new Error('baca file berhenti di offset ' + (offset + read));
                  read += n;
              }
          }
          async function mfCall(method, action, query = {}, body = undefined, headers = {}) {
              const qs = new URLSearchParams({ ...query, session_token: TOKEN, response_format: 'json' });
              const res = await fetch(API + '/' + action + '.php?' + qs.toString(), { method, headers, body });
              const text = await res.text();
              let data;
              try { data = JSON.parse(text); } catch (e) { throw new Error(action + ': respons bukan JSON (HTTP ' + res.status + ')'); }
              const r = data.response || data;
              if (r.result !== 'Success') throw new Error(action + ': ' + (r.message || r.error || r.result || ('HTTP ' + res.status)));
              return r;
          }
          async function pollUpload(key) {
              for (let i = 0; i < POLL_MAX; i++) {
                  const r = await mfCall('GET', 'upload/poll_upload', { key });
                  const d = r.doupload || (Array.isArray(r.douploads) && r.douploads[0]) || {};
                  if (d.fileerror) throw new Error('fileerror MediaFire ' + d.fileerror);
                  if (String(d.status) === '99' && d.quickkey) return d.quickkey;
                  await sleep(POLL_INTERVAL);
              }
              throw new Error('timeout nunggu MediaFire memproses file');
          }
          async function uploadResumable(file, name, size, fileHash) {
              const chk = await mfCall('GET', 'upload/check', { filename: name, size, hash: fileHash, resumable: 'yes' });
              const ru = chk.resumable_upload;
              if (!ru) {
                  if (chk.hash_exists === 'yes') {
                      const inst = await mfCall('POST', 'upload/instant', { filename: name, size, hash: fileHash });
                      if (inst.quickkey) return inst.quickkey;
                  }
                  throw new Error('upload/check tidak mengembalikan resumable_upload');
              }
              const unitSize = Number(ru.unit_size), units = Number(ru.number_of_units);
              if (!unitSize || !units) throw new Error('unit_size / number_of_units tidak valid');
              const fd = fs.openSync(file, 'r');
              try {
                  let key = null, last = null;
                  for (let id = 0; id < units; id++) {
                      const offset = id * unitSize;
                      const len = Math.min(unitSize, size - offset);
                      const chunk = Buffer.alloc(len);
                      readRange(fd, chunk, offset);
                      const unitHash = sha256Buf(chunk);
                      let ok = false, lastErr = null;
                      for (let a = 1; a <= UNIT_RETRY && !ok; a++) {
                          try {
                              last = await mfCall('POST', 'upload/resumable', {}, chunk, {
                                  'Content-Type': 'application/octet-stream',
                                  'x-filename': name,
                                  'x-filesize': String(size),
                                  'x-filehash': fileHash,
                                  'x-unit-hash': unitHash,
                                  'x-unit-id': String(id),
                                  'x-unit-size': String(len)
                              });
                              key = (last.doupload && last.doupload.key) || key;
                              ok = true;
                          } catch (e) { lastErr = e; await sleep(1500 * a); }
                      }
                      if (!ok) throw new Error('unit ' + id + ' gagal: ' + (lastErr ? lastErr.message : '?'));
                  }
                  const ready = last && last.resumable_upload && last.resumable_upload.all_units_ready;
                  if (ready !== 'yes') throw new Error('MediaFire belum menerima semua unit (all_units_ready=' + ready + ')');
                  if (!key) throw new Error('key upload tidak ditemukan');
                  return pollUpload(key);
              } finally { fs.closeSync(fd); }
          }
          (async () => {
              try {
                  if (!TOKEN) throw new Error('MEDIAFIRE_SESSION_TOKEN kosong (cek GitHub Secrets)');
                  const apks = findApks(SEARCH_DIR);
                  if (!apks.length) throw new Error('tidak ada file .apk di ' + SEARCH_DIR);
                  const file = pickApk(apks);
                  const name = safeName(path.basename(file));
                  const size = fs.statSync(file).size;
                  if (size <= SKIP_BELOW) {
                      console.log('MEDIAFIRE_SKIP=' + name + ' (' + (size / 1024 / 1024).toFixed(2) + ' MB, di bawah 50 MB)');
                      return;
                  }
                  const fileHash = await sha256Stream(file);
                  console.log('MEDIAFIRE_FILE=' + name + ' (' + size + ' bytes)');
                  const qk = await uploadResumable(file, name, size, fileHash);
                  console.log('MEDIAFIRE_URL=https://www.mediafire.com/file/' + qk);
              } catch (e) {
                  console.log('MEDIAFIRE_ERROR=' + e.message);
                  console.log('::warning::Upload MediaFire gagal: ' + e.message);
              }
          })();
          JSEOF

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: out/*.apk
          retention-days: 3

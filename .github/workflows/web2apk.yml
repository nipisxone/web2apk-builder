# ==========================================
# REY X BONTEN - Web2APK Builder (v2)
# URL website -> APK Android (via WebView)
# ==========================================

name: Web2APK Builder

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: true
        type: string
      icon_url:
        description: 'Icon URL (optional, PNG 512x512)'
        required: false
        default: ""
        type: string
      package_name:
        description: 'Package Name'
        required: true
        type: string
        default: 'com.reymd.webapp'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Pakai Android SDK bawaan runner ubuntu-24.04 (tidak pakai setup-android yang gagal)
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKMGR" ]; then SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager tidak ditemukan di $SDK"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          if [ -d "$SDK/platforms/android-34" ] && [ -d "$SDK/build-tools/34.0.0" ] && [ -d "$SDK/platform-tools" ]; then
            echo "Android SDK packages sudah ada, skip install."
          else
            (yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null) || true
            "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Create WebView project
        shell: bash
        env:
          SITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
          PKG_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          # ---------- helper escape ----------
          xml_escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'; }

          # ---------- sanitize input ----------
          if ! echo "$SITE_URL" | grep -qE '^https?://'; then
            echo "::error::URL harus http:// atau https://"
            exit 1
          fi
          SAFE_NAME=$(echo "$APP_NAME" | sed "s/[\"']//g")
          [ -z "$SAFE_NAME" ] && SAFE_NAME="WebApp"
          SAFE_NAME_XML=$(xml_escape "$SAFE_NAME")

          # package: huruf kecil, tiap segmen harus diawali huruf
          SAFE_PKG=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9.')
          SAFE_PKG=$(echo "$SAFE_PKG" | awk -F. 'BEGIN{OFS="."} {for(i=1;i<=NF;i++){ if($i ~ /^[0-9]/) $i="a"$i } print}')
          SAFE_PKG=$(echo "$SAFE_PKG" | sed -E 's/\.+/./g; s/^\.//; s/\.$//')
          if ! echo "$SAFE_PKG" | grep -qE '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            SAFE_PKG="com.reymd.webapp"
          fi

          mkdir -p webview/app/src/main/java/com/rey/webview
          mkdir -p webview/app/src/main/res/mipmap-hdpi
          mkdir -p webview/app/src/main/res/mipmap-mdpi
          mkdir -p webview/app/src/main/res/mipmap-xhdpi
          mkdir -p webview/app/src/main/res/mipmap-xxhdpi
          mkdir -p webview/app/src/main/res/mipmap-xxxhdpi
          mkdir -p webview/gradle/wrapper
          cd webview

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReyWebApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          EOF

          cat > app/build.gradle << GRADLE_EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${SAFE_PKG}'
              compileSdk 34
              defaultConfig {
                  applicationId '${SAFE_PKG}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug { }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_EOF

          cat > app/src/main/AndroidManifest.xml << MANIFEST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${SAFE_NAME_XML}"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          # MainActivity: placeholder __SITE_URL__ diisi aman di bawah
          cat > app/src/main/java/com/rey/webview/MainActivity.java << 'JAVA_EOF'
          package com.rey.webview;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQ = 1001;
              private static final String SITE_URL = "__SITE_URL__";
              private WebView webView;
              private ProgressBar progressBar;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  progressBar = new ProgressBar(this);
                  progressBar.setVisibility(View.GONE);
                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient() {
                      // link non-web (tel:, mailto:, whatsapp://, intent://, dll) dibuka aplikasinya, bukan bikin error
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (scheme == null) return false;
                          if (scheme.equals("http") || scheme.equals("https") || scheme.equals("about")
                                  || scheme.equals("data") || scheme.equals("blob") || scheme.equals("file")
                                  || scheme.equals("javascript")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException e) {
                              // aplikasi tujuan tidak terpasang: abaikan
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }

                      // halaman gagal dimuat: tampilkan pesan + tombol coba lagi, bukan layar error mentah
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              progressBar.setVisibility(View.GONE);
                              String html = "<html><body style='font-family:sans-serif;text-align:center;padding:24px;background:#111;color:#eee'>"
                                      + "<h3>Gagal memuat halaman</h3>"
                                      + "<p>Cek koneksi internet, lalu coba lagi.</p>"
                                      + "<p><a style='color:#6cf' href='" + SITE_URL + "'>Coba lagi</a></p>"
                                      + "</body></html>";
                              view.loadDataWithBaseURL(SITE_URL, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  // download (mis. APK/file dari website) dibuka lewat aplikasi browser/download
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (ActivityNotFoundException e) { }
                      }
                  });

                  // upload foto & video: pemilih file Android
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;

                          boolean multiple = params != null && params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");

                          String[] accept = (params != null) ? params.getAcceptTypes() : null;
                          String[] mimes = (accept != null && accept.length > 0 && !accept[0].trim().isEmpty())
                                  ? accept
                                  : new String[]{"image/*", "video/*"};
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, mimes);
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, multiple);

                          try {
                              startActivityForResult(Intent.createChooser(intent, "Pilih file"), FILE_CHOOSER_REQ);
                          } catch (Exception e) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  root.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT));
                  root.addView(progressBar, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      android.view.Gravity.CENTER));

                  setContentView(root);
                  webView.loadUrl(SITE_URL);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQ) return;

                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int n = data.getClipData().getItemCount();
                          results = new Uri[n];
                          for (int i = 0; i < n; i++) {
                              results[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }
                  }
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          JAVA_EOF

          # Pindah ke package path + isi URL dengan escape Java yang aman
          PKG_PATH=$(echo "$SAFE_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          python3 - "app/src/main/java/com/rey/webview/MainActivity.java" "app/src/main/java/$PKG_PATH/MainActivity.java" "$SAFE_PKG" "$SITE_URL" << 'PY_EOF'
          import sys
          src, dst, pkg, url = sys.argv[1:5]
          code = open(src, encoding='utf-8').read()
          code = code.replace('package com.rey.webview;', 'package ' + pkg + ';', 1)
          safe_url = url.replace('\\', '\\\\').replace('"', '\\"')
          code = code.replace('__SITE_URL__', safe_url, 1)
          open(dst, 'w', encoding='utf-8').write(code)
          PY_EOF
          rm -rf app/src/main/java/com/rey

          # ---------- icon ----------
          ICON_OK=false
          if [ -n "$ICON_URL" ]; then
            echo "Downloading icon..."
            curl -fsSL --connect-timeout 15 --max-time 60 "$ICON_URL" -o /tmp/icon.png && ICON_OK=true || ICON_OK=false
          fi

          if [ "$ICON_OK" = "true" ] && file /tmp/icon.png | grep -qE "PNG|JPEG|image"; then
            echo "Icon valid, resizing..."
            command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            for SIZE in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              PX=${SIZE%%:*}
              DPI=${SIZE##*:}
              convert /tmp/icon.png -resize ${PX}x${PX} "app/src/main/res/mipmap-${DPI}/ic_launcher.png" 2>/dev/null || \
                cp /tmp/icon.png "app/src/main/res/mipmap-${DPI}/ic_launcher.png"
            done
          else
            echo "No valid icon, using placeholder..."
            python3 -c "
          from PIL import Image
          Image.new('RGB', (192, 192), color=(15, 15, 20)).save('/tmp/placeholder.png')
          " 2>/dev/null || echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" | base64 -d > /tmp/placeholder.png
            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp /tmp/placeholder.png "app/src/main/res/mipmap-${DPI}/ic_launcher.png"
            done
          fi

          echo "WebView project ready."
          echo "ANDROID_PROJECT=$(pwd)" >> "$GITHUB_ENV"

      # Cache Gradle: dist Gradle & plugin Android nggak di-download ulang tiap build
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-web2apk-8.7-v1
          restore-keys: |
            gradle-web2apk-

      - name: Bootstrap Gradle wrapper
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="8.7"

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar || true
          fi

          if [ ! -f "./gradlew" ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              sudo unzip -q /tmp/gradle.zip -d /opt
              sudo ln -sfn "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
            fi
            gradle wrapper --gradle-version "$GRADLE_VER"
          fi

          cat > gradle/wrapper/gradle-wrapper.properties << EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon --stacktrace assembleRelease || \
            ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$ANDROID_PROJECT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1 || true)"
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            find "$ANDROID_PROJECT" -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" output/app.apk
          echo "APK: $APK ($(du -h output/app.apk | cut -f1))"

      # Upload APK ke MediaFire (kalau > 50 MB). Kalau gagal, build tetap sukses dan bot pakai fallback GitHub Release.
      - name: Upload APK ke MediaFire
        if: success()
        continue-on-error: true
        env:
          MEDIAFIRE_SESSION_TOKEN: ${{ secrets.MEDIAFIRE_SESSION_TOKEN }}
          APK_SEARCH_DIR: output
        run: |
          node - <<'JSEOF'
          // Upload APK ke MediaFire dari job GitHub Actions. Tanpa dependency (Node 18+).
          // Env: MEDIAFIRE_SESSION_TOKEN (wajib), APK_SEARCH_DIR (default '.')
          // APK <= 50 MB dilewati (dikirim langsung ke Telegram oleh bot).
          // Output log: MEDIAFIRE_URL=... | MEDIAFIRE_SKIP=... | MEDIAFIRE_ERROR=...
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const API = process.env.MEDIAFIRE_API || 'https://www.mediafire.com/api/1.4';
          const TOKEN = process.env.MEDIAFIRE_SESSION_TOKEN || '';
          const SEARCH_DIR = process.env.APK_SEARCH_DIR || '.';
          const SKIP_BELOW = 50 * 1024 * 1024;
          const UNIT_RETRY = 3;
          const POLL_INTERVAL = 3000;
          const POLL_MAX = 600;
          const SKIP_DIRS = new Set(['node_modules', '.git']);

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function safeName(n) { return String(n || 'app.apk').replace(/[^A-Za-z0-9._-]/g, '_'); }
          function sha256Buf(buf) { return crypto.createHash('sha256').update(buf).digest('hex'); }
          function sha256Stream(file) {
              return new Promise((resolve, reject) => {
                  const h = crypto.createHash('sha256');
                  fs.createReadStream(file).on('data', d => h.update(d)).on('end', () => resolve(h.digest('hex'))).on('error', reject);
              });
          }
          function findApks(dir, out = []) {
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                  const p = path.join(dir, e.name);
                  if (e.isDirectory()) { if (!SKIP_DIRS.has(e.name)) findApks(p, out); }
                  else if (e.isFile() && e.name.toLowerCase().endsWith('.apk')) out.push(p);
              }
              return out;
          }
          function pickApk(files) { return files.find(f => !/arm|x86/i.test(path.basename(f))) || files[0]; }
          function readRange(fd, buf, offset) {
              let read = 0;
              while (read < buf.length) {
                  const n = fs.readSync(fd, buf, read, buf.length - read, offset + read);
                  if (n === 0) throw new Error('baca file berhenti di offset ' + (offset + read));
                  read += n;
              }
          }
          async function mfCall(method, action, query = {}, body = undefined, headers = {}) {
              const qs = new URLSearchParams({ ...query, session_token: TOKEN, response_format: 'json' });
              const res = await fetch(API + '/' + action + '.php?' + qs.toString(), { method, headers, body });
              const text = await res.text();
              let data;
              try { data = JSON.parse(text); } catch (e) { throw new Error(action + ': respons bukan JSON (HTTP ' + res.status + ')'); }
              const r = data.response || data;
              if (r.result !== 'Success') throw new Error(action + ': ' + (r.message || r.error || r.result || ('HTTP ' + res.status)));
              return r;
          }
          async function pollUpload(key) {
              for (let i = 0; i < POLL_MAX; i++) {
                  const r = await mfCall('GET', 'upload/poll_upload', { key });
                  const d = r.doupload || (Array.isArray(r.douploads) && r.douploads[0]) || {};
                  if (d.fileerror) throw new Error('fileerror MediaFire ' + d.fileerror);
                  if (String(d.status) === '99' && d.quickkey) return d.quickkey;
                  await sleep(POLL_INTERVAL);
              }
              throw new Error('timeout nunggu MediaFire memproses file');
          }
          async function uploadResumable(file, name, size, fileHash) {
              const chk = await mfCall('GET', 'upload/check', { filename: name, size, hash: fileHash, resumable: 'yes' });
              const ru = chk.resumable_upload;
              if (!ru) {
                  if (chk.hash_exists === 'yes') {
                      const inst = await mfCall('POST', 'upload/instant', { filename: name, size, hash: fileHash });
                      if (inst.quickkey) return inst.quickkey;
                  }
                  throw new Error('upload/check tidak mengembalikan resumable_upload');
              }
              const unitSize = Number(ru.unit_size), units = Number(ru.number_of_units);
              if (!unitSize || !units) throw new Error('unit_size / number_of_units tidak valid');
              const fd = fs.openSync(file, 'r');
              try {
                  let key = null, last = null;
                  for (let id = 0; id < units; id++) {
                      const offset = id * unitSize;
                      const len = Math.min(unitSize, size - offset);
                      const chunk = Buffer.alloc(len);
                      readRange(fd, chunk, offset);
                      const unitHash = sha256Buf(chunk);
                      let ok = false, lastErr = null;
                      for (let a = 1; a <= UNIT_RETRY && !ok; a++) {
                          try {
                              last = await mfCall('POST', 'upload/resumable', {}, chunk, {
                                  'Content-Type': 'application/octet-stream',
                                  'x-filename': name,
                                  'x-filesize': String(size),
                                  'x-filehash': fileHash,
                                  'x-unit-hash': unitHash,
                                  'x-unit-id': String(id),
                                  'x-unit-size': String(len)
                              });
                              key = (last.doupload && last.doupload.key) || key;
                              ok = true;
                          } catch (e) { lastErr = e; await sleep(1500 * a); }
                      }
                      if (!ok) throw new Error('unit ' + id + ' gagal: ' + (lastErr ? lastErr.message : '?'));
                  }
                  const ready = last && last.resumable_upload && last.resumable_upload.all_units_ready;
                  if (ready !== 'yes') throw new Error('MediaFire belum menerima semua unit (all_units_ready=' + ready + ')');
                  if (!key) throw new Error('key upload tidak ditemukan');
                  return pollUpload(key);
              } finally { fs.closeSync(fd); }
          }
          (async () => {
              try {
                  if (!TOKEN) throw new Error('MEDIAFIRE_SESSION_TOKEN kosong (cek GitHub Secrets)');
                  const apks = findApks(SEARCH_DIR);
                  if (!apks.length) throw new Error('tidak ada file .apk di ' + SEARCH_DIR);
                  const file = pickApk(apks);
                  const name = safeName(path.basename(file));
                  const size = fs.statSync(file).size;
                  if (size <= SKIP_BELOW) {
                      console.log('MEDIAFIRE_SKIP=' + name + ' (' + (size / 1024 / 1024).toFixed(2) + ' MB, di bawah 50 MB)');
                      return;
                  }
                  const fileHash = await sha256Stream(file);
                  console.log('MEDIAFIRE_FILE=' + name + ' (' + size + ' bytes)');
                  const qk = await uploadResumable(file, name, size, fileHash);
                  console.log('MEDIAFIRE_URL=https://www.mediafire.com/file/' + qk);
              } catch (e) {
                  console.log('MEDIAFIRE_ERROR=' + e.message);
                  console.log('::warning::Upload MediaFire gagal: ' + e.message);
              }
          })();
          JSEOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_id }}
          path: output/app.apk
          if-no-files-found: error
          retention-days: 1

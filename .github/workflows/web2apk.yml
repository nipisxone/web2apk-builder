# ==========================================
# REY X BONTEN - Web2APK Builder (v2)
# URL website -> APK Android (via WebView)
# ==========================================

name: Web2APK Builder

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      app_name:
        description: 'App Name'
        required: true
        type: string
      icon_url:
        description: 'Icon URL (optional, PNG 512x512)'
        required: false
        default: ""
        type: string
      package_name:
        description: 'Package Name'
        required: true
        type: string
        default: 'com.reymd.webapp'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # Pakai Android SDK bawaan runner ubuntu-24.04 (tidak pakai setup-android yang gagal)
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKMGR" ]; then SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKMGR" ]; then
            echo "::error::sdkmanager tidak ditemukan di $SDK"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          (yes | "$SDKMGR" --sdk_root="$SDK" --licenses >/dev/null) || true
          "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create WebView project
        shell: bash
        env:
          SITE_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
          PKG_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          # ---------- helper escape ----------
          xml_escape() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'; }

          # ---------- sanitize input ----------
          if ! echo "$SITE_URL" | grep -qE '^https?://'; then
            echo "::error::URL harus http:// atau https://"
            exit 1
          fi
          SAFE_NAME=$(echo "$APP_NAME" | sed "s/[\"']//g")
          [ -z "$SAFE_NAME" ] && SAFE_NAME="WebApp"
          SAFE_NAME_XML=$(xml_escape "$SAFE_NAME")

          # package: huruf kecil, tiap segmen harus diawali huruf
          SAFE_PKG=$(echo "$PKG_NAME" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9.')
          SAFE_PKG=$(echo "$SAFE_PKG" | awk -F. 'BEGIN{OFS="."} {for(i=1;i<=NF;i++){ if($i ~ /^[0-9]/) $i="a"$i } print}')
          SAFE_PKG=$(echo "$SAFE_PKG" | sed -E 's/\.+/./g; s/^\.//; s/\.$//')
          if ! echo "$SAFE_PKG" | grep -qE '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            SAFE_PKG="com.reymd.webapp"
          fi

          mkdir -p webview/app/src/main/java/com/rey/webview
          mkdir -p webview/app/src/main/res/mipmap-hdpi
          mkdir -p webview/app/src/main/res/mipmap-mdpi
          mkdir -p webview/app/src/main/res/mipmap-xhdpi
          mkdir -p webview/app/src/main/res/mipmap-xxhdpi
          mkdir -p webview/app/src/main/res/mipmap-xxxhdpi
          mkdir -p webview/gradle/wrapper
          cd webview

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReyWebApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g
          org.gradle.parallel=true
          EOF

          cat > app/build.gradle << GRADLE_EOF
          plugins { id 'com.android.application' }
          android {
              namespace '${SAFE_PKG}'
              compileSdk 34
              defaultConfig {
                  applicationId '${SAFE_PKG}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug { }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          GRADLE_EOF

          cat > app/src/main/AndroidManifest.xml << MANIFEST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="${SAFE_NAME_XML}"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          # MainActivity: placeholder __SITE_URL__ diisi aman di bawah
          cat > app/src/main/java/com/rey/webview/MainActivity.java << 'JAVA_EOF'
          package com.rey.webview;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.ProgressBar;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {

              private static final int FILE_CHOOSER_REQ = 1001;
              private static final String SITE_URL = "__SITE_URL__";
              private WebView webView;
              private ProgressBar progressBar;
              private ValueCallback<Uri[]> filePathCallback;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  progressBar = new ProgressBar(this);
                  progressBar.setVisibility(View.GONE);
                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  webView.setWebViewClient(new WebViewClient() {
                      // link non-web (tel:, mailto:, whatsapp://, intent://, dll) dibuka aplikasinya, bukan bikin error
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if (scheme == null) return false;
                          if (scheme.equals("http") || scheme.equals("https") || scheme.equals("about")
                                  || scheme.equals("data") || scheme.equals("blob") || scheme.equals("file")
                                  || scheme.equals("javascript")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                          } catch (ActivityNotFoundException e) {
                              // aplikasi tujuan tidak terpasang: abaikan
                          }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          progressBar.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          progressBar.setVisibility(View.GONE);
                      }

                      // halaman gagal dimuat: tampilkan pesan + tombol coba lagi, bukan layar error mentah
                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              progressBar.setVisibility(View.GONE);
                              String html = "<html><body style='font-family:sans-serif;text-align:center;padding:24px;background:#111;color:#eee'>"
                                      + "<h3>Gagal memuat halaman</h3>"
                                      + "<p>Cek koneksi internet, lalu coba lagi.</p>"
                                      + "<p><a style='color:#6cf' href='" + SITE_URL + "'>Coba lagi</a></p>"
                                      + "</body></html>";
                              view.loadDataWithBaseURL(SITE_URL, html, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  // download (mis. APK/file dari website) dibuka lewat aplikasi browser/download
                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (ActivityNotFoundException e) { }
                      }
                  });

                  // upload foto & video: pemilih file Android
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = callback;

                          boolean multiple = params != null && params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");

                          String[] accept = (params != null) ? params.getAcceptTypes() : null;
                          String[] mimes = (accept != null && accept.length > 0 && !accept[0].trim().isEmpty())
                                  ? accept
                                  : new String[]{"image/*", "video/*"};
                          intent.putExtra(Intent.EXTRA_MIME_TYPES, mimes);
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, multiple);

                          try {
                              startActivityForResult(Intent.createChooser(intent, "Pilih file"), FILE_CHOOSER_REQ);
                          } catch (Exception e) {
                              filePathCallback.onReceiveValue(null);
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  root.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT));
                  root.addView(progressBar, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      android.view.Gravity.CENTER));

                  setContentView(root);
                  webView.loadUrl(SITE_URL);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQ) return;

                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int n = data.getClipData().getItemCount();
                          results = new Uri[n];
                          for (int i = 0; i < n; i++) {
                              results[i] = data.getClipData().getItemAt(i).getUri();
                          }
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }
                  }
                  if (filePathCallback != null) {
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView != null && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          JAVA_EOF

          # Pindah ke package path + isi URL dengan escape Java yang aman
          PKG_PATH=$(echo "$SAFE_PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          python3 - "app/src/main/java/com/rey/webview/MainActivity.java" "app/src/main/java/$PKG_PATH/MainActivity.java" "$SAFE_PKG" "$SITE_URL" << 'PY_EOF'
          import sys
          src, dst, pkg, url = sys.argv[1:5]
          code = open(src, encoding='utf-8').read()
          code = code.replace('package com.rey.webview;', 'package ' + pkg + ';', 1)
          safe_url = url.replace('\\', '\\\\').replace('"', '\\"')
          code = code.replace('__SITE_URL__', safe_url, 1)
          open(dst, 'w', encoding='utf-8').write(code)
          PY_EOF
          rm -rf app/src/main/java/com/rey

          # ---------- icon ----------
          ICON_OK=false
          if [ -n "$ICON_URL" ]; then
            echo "Downloading icon..."
            curl -fsSL --connect-timeout 15 --max-time 60 "$ICON_URL" -o /tmp/icon.png && ICON_OK=true || ICON_OK=false
          fi

          if [ "$ICON_OK" = "true" ] && file /tmp/icon.png | grep -qE "PNG|JPEG|image"; then
            echo "Icon valid, resizing..."
            sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
            for SIZE in 48:mdpi 72:hdpi 96:xhdpi 144:xxhdpi 192:xxxhdpi; do
              PX=${SIZE%%:*}
              DPI=${SIZE##*:}
              convert /tmp/icon.png -resize ${PX}x${PX} "app/src/main/res/mipmap-${DPI}/ic_launcher.png" 2>/dev/null || \
                cp /tmp/icon.png "app/src/main/res/mipmap-${DPI}/ic_launcher.png"
            done
          else
            echo "No valid icon, using placeholder..."
            python3 -c "
          from PIL import Image
          Image.new('RGB', (192, 192), color=(15, 15, 20)).save('/tmp/placeholder.png')
          " 2>/dev/null || echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" | base64 -d > /tmp/placeholder.png
            for DPI in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              cp /tmp/placeholder.png "app/src/main/res/mipmap-${DPI}/ic_launcher.png"
            done
          fi

          echo "WebView project ready."
          echo "ANDROID_PROJECT=$(pwd)" >> "$GITHUB_ENV"

      - name: Bootstrap Gradle wrapper
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VER="8.7"

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}.0/gradle/wrapper/gradle-wrapper.jar" \
              -o gradle/wrapper/gradle-wrapper.jar || true
          fi

          if [ ! -f "./gradlew" ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
              sudo unzip -q /tmp/gradle.zip -d /opt
              sudo ln -sfn "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
            fi
            gradle wrapper --gradle-version "$GRADLE_VER"
          fi

          cat > gradle/wrapper/gradle-wrapper.properties << EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VER}-all.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x ./gradlew
          ls -la gradle/wrapper/

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew --no-daemon --stacktrace assembleRelease || \
            ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find "$ANDROID_PROJECT" -type f -path '*/build/outputs/apk/*' -name '*.apk' -size +10k | head -1 || true)"
          if [ -z "${APK:-}" ]; then
            echo "::error::APK tidak ditemukan."
            find "$ANDROID_PROJECT" -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" output/app.apk
          echo "APK: $APK ($(du -h output/app.apk | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-${{ github.run_id }}
          path: output/app.apk
          if-no-files-found: error
          retention-days: 1
